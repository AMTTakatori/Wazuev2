<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wazue Store — Cửa hàng Tài khoản & Dịch vụ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --teal: #00d4aa;
      --teal-hover: #00ffcc;
      --blue: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --radius: 14px;
      --font: 'Outfit', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Top Navigation */
    .navbar {
      background: rgba(19, 27, 46, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 100;
      padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand {
      font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px;
    }
    .brand span { color: var(--teal); }

    .user-nav { display: flex; align-items: center; gap: 12px; }
    .balance-badge {
      background: rgba(0, 212, 170, 0.1);
      border: 1px solid rgba(0, 212, 170, 0.3);
      padding: 6px 14px; border-radius: 30px;
      font-size: 13px; font-weight: 600; color: var(--teal);
      font-family: var(--mono);
    }

    /* Container */
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .section-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title i { color: var(--teal); }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: all 0.25s ease;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--teal);
      box-shadow: 0 10px 25px rgba(0, 212, 170, 0.15);
    }

    /* Product Image Container */
    .product-img-wrap {
      width: 100%; height: 160px;
      background: #0f172a;
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .product-img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .product-card:hover .product-img { transform: scale(1.05); }
    .product-placeholder { font-size: 40px; color: var(--muted); opacity: 0.4; }

    .product-body { padding: 18px; display: flex; flex-direction: column; flex: 1; }
    .product-name { font-size: 17px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .product-desc { font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 14px; flex: 1; }
    
    .product-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: auto; pt: 12px; border-top: 1px solid rgba(255,255,255,0.05);
    }
    .product-price { font-size: 18px; font-weight: 800; color: var(--teal); font-family: var(--mono); }

    /* Buttons */
    .btn {
      padding: 9px 16px; border-radius: 8px; border: none;
      font-family: var(--font); font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-teal { background: var(--teal); color: #000; }
    .btn-teal:hover { background: var(--teal-hover); box-shadow: 0 4px 15px rgba(0,212,170,0.3); }
    .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
    .btn-outline:hover { background: rgba(255,255,255,0.05); border-color: var(--teal); color: var(--teal); }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 18px; padding: 26px; width: 100%; max-width: 440px;
      position: relative; animation: popUp 0.25s ease;
    }
    @keyframes popUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--text); }
    .result-box {
      background: #0f172a; border: 1px dashed var(--teal);
      border-radius: 10px; padding: 14px; font-family: var(--mono);
      font-size: 13px; color: var(--teal); word-break: break-all; margin: 14px 0;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-control {
      width: 100%; background: #0f172a; border: 1px solid var(--card-border);
      border-radius: 8px; padding: 10px 12px; color: var(--text);
      font-family: var(--font); font-size: 14px; outline: none;
    }
    .form-control:focus { border-color: var(--teal); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="brand">
      <i class="fa-solid fa-bolt" style="color:var(--teal)"></i> Wazue<span>Store</span>
    </div>
    <div class="user-nav">
      <div id="user-info" style="display:none; align-items:center; gap:10px;">
        <span class="balance-badge" id="user-balance">0đ</span>
        <button class="btn btn-outline" onclick="openDepositModal()"><i class="fa-solid fa-wallet"></i> Nạp tiền</button>
      </div>
      <button class="btn btn-teal" id="btn-login" onclick="openAuthModal()"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <div class="section-title">
      <i class="fa-solid fa-store"></i> Danh sách Sản phẩm
    </div>
    <div class="product-grid" id="product-list">
      <div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: var(--teal);"></i>
        <p style="margin-top: 10px;">Đang tải danh sách sản phẩm...</p>
      </div>
    </div>
  </div>

  <!-- MODAL BÀN GIAO SẢN PHẨM / TÀI KHOẢN -->
  <div class="modal-overlay" id="modal-result">
    <div class="modal-box">
      <div class="modal-title"><i class="fa-solid fa-circle-check" style="color:var(--teal)"></i> Mua Hàng Thành Công!</div>
      <p style="font-size: 13px; color: var(--muted);">Cảm ơn bạn đã mua hàng. Dưới đây là thông tin nhận sản phẩm của bạn:</p>
      
      <div class="result-box" id="result-account-content">---</div>
      
      <div id="link-action-wrap" style="display:none; margin-bottom: 14px;">
        <a id="btn-open-link" href="#" target="_blank" class="btn btn-teal" style="width:100%; text-decoration:none;">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Truy Cập Link Ngay
        </a>
      </div>

      <button class="btn btn-outline" style="width: 100%;" onclick="closeModal('modal-result')">Đóng</button>
    </div>
  </div>

  <!-- MODAL ĐĂNG NHẬP -->
  <div class="modal-overlay" id="modal-auth">
    <div class="modal-box">
      <div class="modal-title"><i class="fa-solid fa-user-lock" style="color:var(--teal)"></i> Đăng Nhập / Đăng Ký</div>
      <div class="form-group">
        <label>Tên tài khoản</label>
        <input type="text" id="auth-user" class="form-control" placeholder="Nhập username...">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="auth-pass" class="form-control" placeholder="••••••••">
      </div>
      <button class="btn btn-teal" style="width: 100%; margin-top: 8px;" onclick="doAuth()">Đăng Nhập Ngay</button>
      <button class="btn btn-outline" style="width: 100%; margin-top: 8px;" onclick="closeModal('modal-auth')">Hủy</button>
    </div>
  </div>

  <script>
    let currentUser = null;

    // 1. Kiểm tra trạng thái Đăng nhập
    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (data.authenticated) {
          currentUser = data.user;
          document.getElementById('user-info').style.display = 'flex';
          document.getElementById('btn-login').style.display = 'none';
          document.getElementById('user-balance').textContent = Number(data.user.balance || 0).toLocaleString('vi-VN') + 'đ';
        }
      } catch(e){}
    }

    // 2. Load Danh sách sản phẩm (Hiển thị Ảnh + Mô tả Filza)
    async function loadProducts() {
      const container = document.getElementById('product-list');
      try {
        const res = await fetch('/api/get-products');
        const products = await res.json();

        if (!products || products.length === 0) {
          container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--muted);">Chưa có sản phẩm nào</div>';
          return;
        }

        container.innerHTML = products.map(p => {
          // Xử lý Ảnh sản phẩm
          const imgHtml = p.image_url
            ? `<img src="${p.image_url}" alt="${p.name}" class="product-img">`
            : `<i class="fa-solid fa-box-open product-placeholder"></i>`;

          // Xử lý Mô tả sản phẩm
          const descText = p.description || p.desc || 'Sản phẩm chất lượng cao tự động bàn giao ngay khi mua.';

          const formattedPrice = Number(p.price || 0).toLocaleString('vi-VN') + 'đ';

          return `
            <div class="product-card">
              <div class="product-img-wrap">
                ${imgHtml}
              </div>
              <div class="product-body">
                <div class="product-name">${p.name}</div>
                <div class="product-desc">${descText}</div>
                <div class="product-footer">
                  <div class="product-price">${formattedPrice}</div>
                  <button class="btn btn-teal" onclick="buyProduct(${p.id})">
                    <i class="fa-solid fa-cart-shopping"></i> Mua ngay
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (e) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ff4f6d;">Lỗi tải sản phẩm!</div>';
      }
    }

    // 3. Mua Sản phẩm
    async function buyProduct(productId) {
      if (!currentUser) {
        openAuthModal();
        return;
      }

      if (!confirm('Bạn có chắc chắn muốn mua sản phẩm này?')) return;

      try {
        const res = await fetch('/api/buy-with-balance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId })
        });
        const data = await res.json();

        if (data.success) {
          const accContent = data.account || 'Thành công!';
          document.getElementById('result-account-content').textContent = accContent;

          // Nếu kết quả trả về là Đường link (Google Drive...)
          const linkWrap = document.getElementById('link-action-wrap');
          const btnLink = document.getElementById('btn-open-link');
          if (accContent.startsWith('http://') || accContent.startsWith('https://')) {
            btnLink.href = accContent;
            linkWrap.style.display = 'block';
          } else {
            linkWrap.style.display = 'none';
          }

          document.getElementById('modal-result').classList.add('active');
          checkAuth(); // Cập nhật lại số dư
        } else {
          alert(data.message || 'Lỗi mua hàng!');
        }
      } catch (e) {
        alert('Lỗi kết nối máy chủ!');
      }
    }

    // 4. Đăng nhập giả lập / Đăng nhập
    async function doAuth() {
      const u = document.getElementById('auth-user').value.trim();
      const p = document.getElementById('auth-pass').value;
      if (!u || !p) return alert('Vui lòng điền đủ thông tin');

      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', username: u, password: p })
      });
      const data = await res.json();
      if (data.success) {
        closeModal('modal-auth');
        checkAuth();
      } else {
        alert(data.message || 'Thất bại');
      }
    }

    function openAuthModal() { document.getElementById('modal-auth').classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // Init
    checkAuth();
    loadProducts();
  </script>
</body>
</html>
